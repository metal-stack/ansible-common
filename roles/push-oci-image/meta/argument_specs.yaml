---
argument_specs:
  main:
    short_description: Pulls an image on the ansible controller, then pushes it to the ansible host.
    description:
      - Pulls an image on the ansible controller, then pushes it to the ansible host.
      - Useful for SONiC switches with active Management VRF, that may not always have a EVPN Underlay.
    options:
      push_oci_image_name:
        type: str
        required: true
        description: OCI image name
      push_oci_image_tag:
        type: str
        required: true
        description: OCI image tag
      push_oci_image_skip_pull:
        type: bool
        default: false
        description: Skips pulling the image on the controller
      push_oci_image_platform:
        type: str
        default: ""
        description: Image platform (e.g. C(linux/amd64)), defaults to the platform of the target host
