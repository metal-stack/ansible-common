---
- name: template service {{ systemd_service_name }}
  template:
    src: service.j2
    dest: /etc/systemd/system/{{ systemd_service_name }}.service
  register: service_unit_result

- name: reload daemon to have the unit file known by systemd
  systemd:
    name: "{{ systemd_service_name }}"
    daemon_reload: yes
  when:
    - service_unit_result is changed

- name: pre-pull docker image
  command: docker pull {{ systemd_docker_image_name }}:{{ systemd_docker_image_tag }}
  register: pull_image_result
  changed_when: "'Downloaded newer image' in pull_image_result.stdout"
  when:
    - systemd_docker_pre_pull | bool

# the image might also be updated without pulling (e.g. through the push-oci-image role),
# so compare the image of the running container with the local image
- name: inspect running container of service {{ systemd_service_name }}
  command: docker container inspect {{ systemd_service_name }}.service
  register: container_inspect_result
  changed_when: false
  failed_when: false

- name: inspect local docker image
  command: docker image inspect {{ systemd_docker_image_name }}:{{ systemd_docker_image_tag }}
  register: image_inspect_result
  changed_when: false
  failed_when: false

- name: check if the running container uses an outdated image
  set_fact:
    # always set, as facts persist across multiple invocations of this role
    systemd_docker_image_changed: >-
      {{ container_inspect_result.rc == 0 and image_inspect_result.rc == 0
         and (container_inspect_result.stdout | from_json)[0].Image != (image_inspect_result.stdout | from_json)[0].Id }}

- name: start service {{ systemd_service_name }}
  systemd:
    name: "{{ systemd_service_name }}"
    state: restarted
    enabled: yes
  when:
    - service_unit_result is changed or pull_image_result is changed or systemd_docker_image_changed | bool or systemd_external_config_changed | bool
    - systemd_start | bool
  register: service_restart_result
  until: service_restart_result is success
  retries: 2
  delay: 10

- name: ensure service is started
  systemd:
    name: "{{ systemd_service_name }}"
    state: started
    enabled: yes
  when: systemd_start | bool
